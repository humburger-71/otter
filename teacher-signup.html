<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otter — Teacher signup</title>
    <link rel="stylesheet" href="teacher.css">
</head>
<body>
    <main class="auth-wrap">
        <section class="auth-panel">
            <a class="teacher-brand" href="index.html"><span class="teacher-mark">O</span><span><strong>otter teachers</strong><small>review workspace</small></span></a>
            <h1>Activate teacher access</h1>
            <p>Use the same email and password as your student account, plus the private staff invite code.</p>
            <form id="teacherSignupForm">
                <div class="auth-field"><label for="teacherName">Name</label><input id="teacherName" type="text" autocomplete="name" required></div>
                <div class="auth-field"><label for="teacherEmail">Teacher email</label><input id="teacherEmail" type="email" autocomplete="email" required></div>
                <div class="auth-field"><label for="teacherPassword">Account password</label><input id="teacherPassword" type="password" autocomplete="current-password" required></div>
                <div class="auth-field"><label for="teacherInvite">Private invite code</label><input id="teacherInvite" type="password" autocomplete="off" required></div>
                <button class="auth-submit" type="submit">Activate teacher access</button>
                <p class="auth-error" id="teacherSignupError"></p>
            </form>
            <div class="auth-switch">Already have access? <a href="teacher-login.html">Teacher login</a></div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="teacher-auth.js?v=1"></script>
</body>
</html>
